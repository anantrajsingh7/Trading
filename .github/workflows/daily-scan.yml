name: Daily Swing Scan

on:
  # DAILY SCHEDULE AND EMAIL DISABLED at the user's request (2026-11-05).
  # Manual dispatch only: nothing runs and nothing is emailed unless you
  # start it yourself from the Actions tab. To re-enable, restore a
  # `schedule:` block here and the "Email dashboard" step below.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/swing-trading-analysis-system-e439iw

      # Skip duplicate scheduled attempts once today's scan already ran.
      # Manual dispatch always runs, so you can force a refresh any time.
      - name: Already scanned today?
        id: guard
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && \
             grep -q "Generated $TODAY" quant-platform/reports/latest.md 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Scan for $TODAY already completed - skipping this attempt."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: >
          pip install pandas numpy yfinance pyyaml python-dotenv scipy
          tqdm sqlalchemy rich lxml pyarrow requests

      - name: Run swing scan
        if: steps.guard.outputs.skip == 'false'
        working-directory: quant-platform
        env:
          CI: "true"
        run: python swing_dashboard.py

      - name: Commit latest report
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "swing-scan-bot"
          git config user.email "actions@github.com"
          git add -f quant-platform/reports/latest.md quant-platform/reports/latest.html
          git diff --cached --quiet && exit 0
          git commit -m "Daily swing scan report [skip ci]"
          # Retry push: if a concurrent run pushed first, rebase keeping
          # our freshly generated report (-X theirs = our commit in rebase)
          for i in 1 2 3; do
            git push && exit 0
            sleep 5
            git pull --rebase -X theirs origin claude/swing-trading-analysis-system-e439iw
          done
          git push
