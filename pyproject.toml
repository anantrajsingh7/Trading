[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitvavo-momentum-agent"
version = "0.1.0"
description = "Evidence-based research, backtesting and paper-trading system for short-horizon momentum events on Bitvavo EUR markets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "bitvavo-momentum-agent contributors" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyarrow>=16",
    "duckdb>=1.0",
    "requests>=2.32",
    "websocket-client>=1.8",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
ml = ["scikit-learn>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
